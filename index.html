<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BABFT Logic Gate Blueprints</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card-bg: #141c28;
      --border: #233146;
      --text: #c5d1e0;
      --heading: #ffffff;
      --accent-blue: #0088ff;
      --accent-green: #00e676;
      --accent-red: #ff3366;
      --accent-orange: #ff9100;
      --accent-purple: #b388ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.5;
    }

    header {
      text-align: center;
      padding: 20px 10px 30px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 30px;
    }

    header h1 {
      color: var(--heading);
      font-size: 28px;
      letter-spacing: 1px;
    }

    header p {
      color: var(--accent-blue);
      font-size: 14px;
      margin-top: 6px;
      font-weight: 600;
    }

    /* Filter Tabs */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 30px;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #fff;
    }

    /* Blueprint List Grid */
    .blueprints-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 25px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .bp-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .bp-header {
      padding: 15px;
      background: #0d131f;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bp-header h2 {
      font-size: 16px;
      color: var(--heading);
    }

    .tag {
      font-size: 10px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .tag-basic { background: rgba(0, 230, 118, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .tag-combo { background: rgba(0, 136, 255, 0.15); color: var(--accent-blue); border: 1px solid var(--accent-blue); }
    .tag-memory { background: rgba(179, 136, 255, 0.15); color: var(--accent-purple); border: 1px solid var(--accent-purple); }
    .tag-math { background: rgba(255, 145, 0, 0.15); color: var(--accent-orange); border: 1px solid var(--accent-orange); }

    .bp-body {
      padding: 15px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .bp-desc {
      font-size: 13px;
      color: var(--text);
    }

    /* Schematic Visualizer Box */
    .schematic-box {
      background: #080b10;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 15px;
    }

    .schematic-box h4 {
      font-size: 11px;
      color: #5d7394;
      text-transform: uppercase;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .diagram-svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Wire guide list */
    .wire-list {
      background: #090d14;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
    }

    .wire-list h4 {
      font-size: 11px;
      color: #5d7394;
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .wire-item {
      font-size: 12px;
      padding: 4px 0;
      border-bottom: 1px solid #141c2b;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .wire-item:last-child {
      border-bottom: none;
    }

    .wire-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot-in { background: var(--accent-blue); }
    .dot-gate { background: var(--accent-purple); }
    .dot-out { background: var(--accent-green); }

    /* Responsive tweaks */
    @media (max-width: 600px) {
      body { padding: 10px; }
      header h1 { font-size: 22px; }
      .blueprints-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

    <button class="filter-btn" onclick="filterCategory('memory')">Memory & Switches</button>
    <button class="filter-btn" onclick="filterCategory('math')">Binary & Math Systems</button>

    function renderBlueprints(category = 'all') {
      const grid = document.getElementById('blueprintGrid');
      grid.innerHTML = '';

      const filtered = category === 'all' 
        ? blueprintData 
        : blueprintData.filter(item => item.category === category);

      filtered.forEach(bp => {
        const card = document.createElement('div');
        card.className = 'bp-card';
        card.innerHTML = `
          <div class="bp-header">
            <h2>${bp.name}</h2>
            <span class="tag tag-${bp.tag}">${bp.tag}</span>
          </div>
          <div class="bp-body">
            <p class="bp-desc">${bp.desc}</p>
            
            <div class="schematic-box">
              <h4>Circuit Diagram Blueprint</h4>
              ${bp.svg}
            </div>

            <div class="wire-list">
              <h4>Wiring Step-By-Step</h4>
              ${bp.wireGuide.map(w => `
                <div class="wire-item">
                  <span class="wire-dot dot-${w.type}"></span>
                  <span>${w.text}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterCategory(cat) {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(`'${cat}'`));
      });
      renderBlueprints(cat);
    }

    // Initial render
    renderBlueprints('all');
  </script>
</body>
</html>
