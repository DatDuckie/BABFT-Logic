<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BABFT Logic & Multi-Color Screen Grid Masterclass</title>
  <style>
    :root {
      --bg: #090d14;
      --card-bg: #111827;
      --card-header: #1f2937;
      --border: #374151;
      --text: #d1d5db;
      --text-bright: #ffffff;
      --accent-cyan: #06b6d4;
      --accent-purple: #8b5cf6;
      --accent-amber: #f59e0b;
      --accent-magenta: #d946ef;

      /* Reserved Pure RGB Colors for Display Outputs */
      --rgb-red: #ef4444;
      --rgb-green: #10b981;
      --rgb-blue: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.5;
    }

    header {
      text-align: center;
      padding: 20px 10px 25px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 25px;
    }

    header h1 {
      color: var(--text-bright);
      font-size: 26px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    header p {
      color: var(--accent-cyan);
      font-size: 14px;
      margin-top: 6px;
      font-weight: 600;
    }

    /* Search & Filter Controls */
    .controls-container {
      max-width: 1400px;
      margin: 0 auto 30px auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    .search-box {
      width: 100%;
      max-width: 550px;
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 18px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent-cyan);
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--accent-cyan);
      border-color: var(--accent-cyan);
      color: #000;
    }

    /* Grid Layout */
    .blueprints-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 25px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .bp-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .bp-header {
      padding: 14px 18px;
      background: var(--card-header);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bp-header h2 {
      font-size: 15px;
      color: var(--text-bright);
    }

    .tag {
      font-size: 10px;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      background: rgba(6, 182, 212, 0.15);
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan);
    }

    .tag-grid {
      background: rgba(217, 70, 239, 0.15);
      color: var(--accent-magenta);
      border-color: var(--accent-magenta);
    }

    .bp-body {
      padding: 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .bp-desc {
      font-size: 13px;
      color: var(--text);
      line-height: 1.5;
    }

    /* Schematic Visualizer Box */
    .schematic-box {
      background: #06090e;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      position: relative;
    }

    .schematic-box h4 {
      font-size: 11px;
      color: #6b7280;
      text-transform: uppercase;
      margin-bottom: 12px;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
    }

    .zoom-btn {
      background: none;
      border: none;
      color: var(--accent-cyan);
      font-size: 11px;
      cursor: pointer;
      font-weight: bold;
    }

    .zoom-btn:hover {
      text-decoration: underline;
    }

    .diagram-svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Wire Mapping Guide List */
    .wire-list {
      background: #0d121d;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
    }

    .wire-list h4 {
      font-size: 11px;
      color: #6b7280;
      text-transform: uppercase;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .wire-item {
      font-size: 12px;
      padding: 7px 0;
      border-bottom: 1px solid #1f2937;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .wire-item:last-child {
      border-bottom: none;
    }

    .wire-badge {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Fullscreen Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 950px;
      width: 100%;
      padding: 25px;
      position: relative;
    }

    .close-modal {
      position: absolute;
      top: 15px;
      right: 20px;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Responsive */
    @media (max-width: 600px) {
      body { padding: 10px; }
      header h1 { font-size: 20px; }
      .blueprints-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

    </div>

    <div class="filter-bar">
      <button class="filter-btn active" onclick="setCategory('all', this)">All Blueprints</button>

      <button class="filter-btn" onclick="setCategory('systems', this)">Mechs & Doors</button>

  <div class="blueprints-grid" id="blueprintGrid">
    <!-- Blueprints injected here -->

          <text x="170" y="44" fill="#fff" font-size="9" font-weight="bold" text-anchor="middle">NOR 1</text>

          <rect x="140" y="105" width="60" height="30" rx="4" fill="#d946ef"/>
          <text x="170" y="124" fill="#fff" font-size="9" font-weight="bold" text-anchor="middle">NOR 2</text>

          <rect x="350" y="25" width="55" height="30" rx="4" fill="#10b981"/>
          <text x="377" y="44" fill="#000" font-size="9" font-weight="bold" text-anchor="middle">OUT Q</text>
        </svg>`
      },
      {
        id: 6,
        name: "Alternating Walker Clock Loop",
        category: "clock",
        tag: "Clock",
        desc: "Automated ticking walker loop. Uses cross-connected Delay blocks and a NOT gate to drive mech leg servos.",
        wireGuide: [
          { color: "#f59e0b", text: "Master Switch (Amber) ➔ Delay Block 1" },
          { color: "#8b5cf6", text: "Delay 1 Output (Purple) ➔ Left Leg Servo & Delay 2" },
          { color: "#d946ef", text: "Delay 2 Output (Magenta) ➔ NOT Gate" },
          { color: "#10b981", text: "NOT Gate Output (Green) ➔ Delay 1 Input [Feedback Loop]" }
        ],
        svg: `<svg class="diagram-svg" viewBox="0 0 420 150">
          <path d="M 50 75 L 120 75" stroke="#f59e0b" stroke-width="3"/>
          <path d="M 180 75 L 220 75" stroke="#8b5cf6" stroke-width="3"/>
          <path d="M 280 75 L 300 75" stroke="#d946ef" stroke-width="3"/>
          <path d="M 350 75 L 370 75 L 370 25 L 95 25 L 95 65 L 120 65" stroke="#10b981" stroke-width="3" fill="none"/>

          <rect x="10" y="60" width="40" height="30" rx="4" fill="#f59e0b"/>
          <text x="30" y="79" fill="#000" font-size="8" font-weight="bold" text-anchor="middle">START</text>

          <rect x="120" y="60" width="60" height="30" rx="4" fill="#8b5cf6"/>
          <text x="150" y="79" fill="#fff" font-size="8" font-weight="bold" text-anchor="middle">DELAY 1</text>

          <rect x="220" y="60" width="60" height="30" rx="4" fill="#d946ef"/>
          <text x="250" y="79" fill="#fff" font-size="8" font-weight="bold" text-anchor="middle">DELAY 2</text>

          <rect x="300" y="60" width="50" height="30" rx="4" fill="#10b981"/>
          <text x="325" y="79" fill="#000" font-size="8" font-weight="bold" text-anchor="middle">NOT</text>
        </svg>`
      }
    ];

    function renderGrid(data) {
      const grid = document.getElementById('blueprintGrid');
      grid.innerHTML = '';

      if (data.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #6b7280;">No blueprints found.</div>`;
        return;
      }

      data.forEach(bp => {
        const card = document.createElement('div');
        card.className = 'bp-card';
        card.innerHTML = `
          <div class="bp-header">
            <h2>${bp.id}. ${bp.name}</h2>
            <span class="tag ${bp.category === 'grid' ? 'tag-grid' : ''}">${bp.tag}</span>
          </div>
          <div class="bp-body">
            <p class="bp-desc">${bp.desc}</p>
            
            <div class="schematic-box">
              <h4>
                <span>Gate Schematic Blueprint</span>
                <button class="zoom-btn" onclick="openModal(${bp.id})">🔍 Zoom / Expand</button>
              </h4>
              ${bp.svg}
            </div>

            <div class="wire-list">
              <h4>Color-Coded Wiring Mapping</h4>
              ${bp.wireGuide.map(w => `
                <div class="wire-item">
                  <span class="wire-badge" style="background-color: ${w.color}"></span>
                  <span>${w.text}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterBlueprints() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = blueprints.filter(bp => {
        const matchesCategory = (activeCategory === 'all' || bp.category === activeCategory);
        const matchesSearch = bp.name.toLowerCase().includes(query) || 
                              bp.desc.toLowerCase().includes(query) ||
                              bp.tag.toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });
      renderGrid(filtered);
    }

    function setCategory(category, btn) {
      activeCategory = category;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterBlueprints();
    }

    function openModal(id) {
      const bp = blueprints.find(b => b.id === id);
      if (!bp) return;
      document.getElementById('modalTitle').innerText = `${bp.id}. ${bp.name}`;
      document.getElementById('modalSvgContainer').innerHTML = bp.svg;
      document.getElementById('zoomModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('zoomModal').style.display = 'none';
    }

    // Load initial
    renderGrid(blueprints);
  </script>
</body>
</html>
