<!DOCTYPE html>
<html lang="en">
<head>

  <title>BABFT Un-Simplified 5x5 Full Gate-Level Color Display Blueprint</title>
  <style>
    :root {
      --bg: #070a0f;
      --panel-bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #cbd5e1;
      --text-bright: #ffffff;
      --accent-cyan: #06b6d4;
      --accent-purple: #9333ea;
      --accent-amber: #f59e0b;
      --accent-magenta: #d946ef;
      
      /* Pure RGB Channel Lines (Reserved for Display Outputs) */
      --rgb-r: #ef4444;
      --rgb-g: #10b981;
      --rgb-b: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.4;
    }

    header {
      text-align: center;
      padding: 20px 10px 25px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 25px;
    }

    header h1 {
      color: var(--text-bright);
      font-size: 26px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    header p {
      color: var(--accent-cyan);
      font-size: 14px;
      margin-top: 6px;
      font-weight: 600;
    }

    .container {
      max-width: 1450px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    /* Diagram Section */
    .diagram-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .diagram-panel h2 {
      font-size: 18px;
      color: var(--text-bright);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .diagram-panel p {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 15px;
    }

    .svg-wrapper {
      background: #030712;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
      overflow-x: auto;
    }

    .diagram-svg {
      width: 100%;
      min-width: 1000px;
      height: auto;
      display: block;
    }

    /* Exploded Node Details & Wiring Guide Grid */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 20px;
    }

    .info-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .info-card h3 {
      font-size: 15px;
      color: var(--text-bright);
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }

    .wire-step {
      font-size: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .wire-step:last-child {
      border-bottom: none;
    }

    .wire-badge {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.3);
    }

    /* Interactive 5x5 Matrix Simulator Panel */

      border: 1px solid var(--border);
